<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroSync — seu app de rotina adaptativa</title>
<meta name="description" content="Rotina que se adapta à sua energia real. Check-in diário, tarefas adaptativas, foco e plano Premium.">
<meta name="theme-color" content="#08239B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   NEUROSYNC APP — tokens herdados do pitch deck
   ================================================================ */
:root{
  --ink-950:#04113C; --ink-900:#061B78; --ink-800:#08239B;
  --ink-700:#0E31B8; --ink-600:#1740D6;
  --blue-500:#1B7BFF; --blue-600:#1462D8; --blue-300:#7FBBFF;
  --lime-400:#B6F65A; --lime-600:#8FD230;
  --white:#fff; --warn:#FFC24A; --danger:#FF7A6B;
  --font-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --font-body:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:14px; --radius-s:9px;
  --pad:clamp(16px,4.4vw,28px);
  --max:1080px;
  --nav-h:72px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink-800);color:var(--white);
  font-family:var(--font-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
svg{display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime-400);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* tipografia ---------------------------------------------------- */
.display{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:-.015em;margin:0}
.d-xl{font-size:clamp(30px,7.4vw,46px)}
.d-l{font-size:clamp(24px,5.2vw,34px)}
.d-m{font-size:clamp(18px,3.4vw,22px)}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-300);margin:0 0 8px}
.muted{color:rgba(255,255,255,.78)}
.t-lime{color:var(--lime-400)} .t-blue{color:var(--blue-300)}

/* barra segmentada — motivo do deck ------------------------------ */
.rule{display:flex;align-items:center;gap:8px;margin:14px 0 0}
.rule i{display:block;height:10px;background:var(--blue-500);border-radius:1px}
.rule i:first-child{width:110px}
.rule i+i{width:10px;background:#fff}
.rule--lime i:first-child{background:var(--lime-400)}

/* botões --------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:700;letter-spacing:.02em;text-decoration:none;cursor:pointer;
  padding:14px 22px;border-radius:var(--radius-s);border:2px solid transparent;
  background:none;transition:transform .16s ease,background .16s ease,color .16s ease;
  min-height:48px;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--lime{background:var(--lime-400);color:var(--ink-950)}
.btn--lime:not(:disabled):hover{background:#fff;transform:translateY(-2px)}
.btn--blue{background:var(--blue-600);color:#fff}
.btn--blue:not(:disabled):hover{background:#fff;color:var(--ink-900);transform:translateY(-2px)}
.btn--ghost{border-color:rgba(255,255,255,.45)}
.btn--ghost:not(:disabled):hover{border-color:var(--lime-400);color:var(--lime-400)}
.btn--sm{padding:9px 14px;min-height:40px;font-size:14px}
.btn--block{width:100%}
.btn--danger{border:2px solid rgba(255,122,107,.7);color:#FFB3A9}
.btn--danger:hover{background:rgba(255,122,107,.14)}

/* cartões -------------------------------------------------------- */
.card{background:var(--ink-700);border-radius:var(--radius);padding:20px}
.card--dark{background:var(--ink-950)}
.card--deep{background:var(--ink-900)}
.card h2,.card h3{margin:0 0 10px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.14);
}
.chip--lime{background:var(--lime-400);color:var(--ink-950)}
.chip--blue{background:var(--blue-600)}
.chip--soft{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)}

/* formulários ---------------------------------------------------- */
.field{display:grid;gap:7px;margin-bottom:16px}
.field>label{font-weight:700;font-size:14px;letter-spacing:.03em}
.field .hint{font-size:13px;color:rgba(255,255,255,.72)}
.input,select,textarea{
  width:100%;padding:14px 15px;border-radius:var(--radius-s);
  background:rgba(255,255,255,.96);color:var(--ink-950);
  border:2px solid transparent;font:inherit;font-size:16px;
}
.input::placeholder{color:#5b6478}
.input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lime-400)}
.input[aria-invalid="true"]{border-color:var(--danger);background:#FFF1EF}
.err{font-size:13px;color:#FFB3A9;font-weight:600;min-height:0}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:700;font-size:14px;letter-spacing:.03em;padding:0;margin-bottom:10px}

/* opções em cartão (radio acessível) ------------------------------ */
.opts{display:grid;gap:10px}
.opts--2{grid-template-columns:1fr 1fr}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{
  display:block;padding:15px 16px;border-radius:var(--radius-s);
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);
  font-weight:600;line-height:1.35;transition:border-color .15s,background .15s;
}
.opt span small{display:block;font-weight:400;font-size:13px;color:rgba(255,255,255,.78);margin-top:3px}
.opt input:checked+span{border-color:var(--lime-400);background:rgba(182,246,90,.16)}
.opt input:focus-visible+span{outline:3px solid var(--lime-400);outline-offset:2px}

/* escala 1-5 ------------------------------------------------------ */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt span{text-align:center;padding:14px 4px;font-family:var(--font-display);font-size:20px}
.scale .opt span small{font-family:var(--font-body);font-size:11px;letter-spacing:.04em;text-transform:uppercase}

/* ================================================================
   LAYOUT DO APP
   ================================================================ */
.appbar{
  position:sticky;top:0;z-index:40;background:rgba(6,27,120,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.12);
}
.appbar__in{max-width:var(--max);margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:17px;text-decoration:none;color:#fff}
.brand svg{width:26px;height:26px}
.brand em{font-style:normal;color:var(--blue-300)}
.appbar__right{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{
  width:40px;height:40px;border-radius:50%;background:var(--blue-500);
  display:grid;place-items:center;font-family:var(--font-display);font-size:15px;
  border:none;cursor:pointer;
}
main{max-width:var(--max);margin:0 auto;padding:22px var(--pad) calc(var(--nav-h) + 34px)}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen__head{margin-bottom:20px}

/* navegação inferior --------------------------------------------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink-950);border-top:1px solid rgba(255,255,255,.14);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar ul{display:flex;list-style:none;margin:0 auto;padding:0;max-width:var(--max)}
.tabbar li{flex:1}
.tabbar button{
  position:relative;width:100%;height:var(--nav-h);background:none;border:0;cursor:pointer;
  display:grid;place-items:center;gap:3px;color:rgba(255,255,255,.68);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.tabbar svg{width:22px;height:22px}
@media(max-width:420px){
  .tabbar button{font-size:9.5px;letter-spacing:.02em}
  .tabbar svg{width:20px;height:20px}
}
.tabbar button[aria-current="page"]{color:var(--lime-400)}
.tabbar button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:4px;background:var(--lime-400);border-radius:0 0 3px 3px;
}
.tabbar li{position:relative}

/* ================================================================
   ONBOARDING
   ================================================================ */
.onb{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink-800)}
.onb__bar{max-width:560px;width:100%;margin:0 auto;padding:20px var(--pad) 0;display:flex;gap:6px}
.onb__bar i{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:1px}
.onb__bar i.on{background:var(--lime-400)}
.onb__body{flex:1;max-width:560px;width:100%;margin:0 auto;padding:26px var(--pad) 30px}
.onb__foot{
  position:sticky;bottom:0;background:linear-gradient(180deg,rgba(8,35,155,0),var(--ink-800) 32%);
  padding:18px var(--pad) calc(20px + env(safe-area-inset-bottom));
  max-width:560px;width:100%;margin:0 auto;display:flex;gap:12px;
}
.onb__foot .btn{flex:1}
.onb__step{animation:fade .3s ease}

/* ================================================================
   HOJE / DASHBOARD
   ================================================================ */
.energy{
  display:grid;gap:18px;align-items:center;
  background:linear-gradient(135deg,var(--ink-700),var(--ink-900));
  border-radius:var(--radius);padding:22px;border-left:6px solid var(--lime-400);
}
@media(min-width:640px){.energy{grid-template-columns:auto 1fr}}
.gauge{width:132px;height:132px;margin:0 auto}
.gauge text{font-family:var(--font-display)}
.energy__label{font-family:var(--font-display);font-size:clamp(20px,4.2vw,27px);text-transform:uppercase;line-height:1;margin:0 0 8px}
.budget{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.budget i{width:13px;height:13px;border-radius:2px;background:rgba(255,255,255,.22)}
.budget i.on{background:var(--lime-400)}

.blocks{display:grid;gap:14px}
.block{background:var(--ink-700);border-radius:var(--radius);overflow:hidden}
.block__head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(0,0,0,.18)}
.block__head h3{margin:0;font-family:var(--font-display);text-transform:uppercase;font-size:15px;letter-spacing:.04em}
.block__head .chip{margin-left:auto}
.tasks{list-style:none;margin:0;padding:6px 10px 12px}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.09)}
.task:last-child{border-bottom:0}
.task__check{
  width:28px;height:28px;flex:none;border-radius:8px;cursor:pointer;
  border:2px solid rgba(255,255,255,.5);background:none;display:grid;place-items:center;padding:0;
}
.task__check svg{width:16px;height:16px;opacity:0;color:var(--ink-950)}
.task--done .task__check{background:var(--lime-400);border-color:var(--lime-400)}
.task--done .task__check svg{opacity:1}
.task__time{
  font-family:var(--font-display);font-size:14px;letter-spacing:.01em;
  min-width:52px;padding-top:3px;color:var(--blue-300);display:grid;gap:1px;line-height:1.25;
}
.task__time i{font-style:normal;font-size:11.5px;color:rgba(255,255,255,.6);position:relative;padding-left:9px}
.task__time i::before{content:"";position:absolute;left:2px;top:50%;width:4px;height:1.5px;background:rgba(255,255,255,.45)}
.task--now{background:rgba(182,246,90,.1);border-radius:8px}
.days{display:flex;gap:6px}
.day{flex:1;position:relative}
.day input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.day span{
  display:grid;place-items:center;height:44px;border-radius:8px;font-weight:700;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);transition:border-color .15s,background .15s;
}
.day input:checked+span{background:rgba(182,246,90,.18);border-color:var(--lime-400);color:var(--lime-400)}
.day input:focus-visible+span{outline:3px solid var(--lime-400);outline-offset:2px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.daystrip{display:flex;gap:4px;margin-top:9px}
.daystrip button{
  width:27px;height:27px;padding:0;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.22);color:rgba(255,255,255,.6);
}
.daystrip button[aria-pressed="true"]{background:rgba(182,246,90,.2);border-color:var(--lime-400);color:var(--lime-400)}
.daystrip button:hover{border-color:var(--lime-400)}
.task--off{opacity:.62}
.weekbar{display:flex;gap:6px;padding:14px 18px 4px}
.weekbar div{flex:1;text-align:center;font-size:11.5px;color:rgba(255,255,255,.7);letter-spacing:.04em}
.weekbar b{display:block;font-family:var(--font-display);font-size:15px;color:#fff;margin-top:3px}
.weekbar .on{color:var(--lime-400)}
.weekbar .on b{color:var(--lime-400)}
.substeps{
  list-style:none;flex:1 0 100%;margin:12px 0 2px 40px;padding:0 0 0 13px;
  display:grid;gap:9px;border-left:2px solid rgba(255,255,255,.18);
}
.substeps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.substeps li.is-done>span{text-decoration:line-through;color:rgba(255,255,255,.55)}
.task__check--sm{width:23px;height:23px;border-radius:6px;border-width:2px}
.task__check--sm svg{width:13px;height:13px}
.progress-mini{height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:9px;max-width:230px;overflow:hidden}
.progress-mini i{display:block;height:100%;background:var(--lime-400);border-radius:3px}
.steplist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.steplist li{display:flex;gap:6px;align-items:center}
.steplist input{flex:1;min-width:0}
.steplist .stepbtn{
  width:40px;height:46px;flex:none;border-radius:8px;cursor:pointer;font-size:15px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25);color:#fff;
}
.steplist .stepbtn:disabled{opacity:.3;cursor:default}
.steplist .stepbtn:not(:disabled):hover{border-color:var(--lime-400);color:var(--lime-400)}
.task__times{display:flex;align-items:center;gap:7px}
.task__times span{color:rgba(255,255,255,.55);font-size:13px}
.task__times input{width:96px;flex:none;padding:9px 8px;font-size:15px}
@media(max-width:560px){
  .task{flex-wrap:wrap}
  .task__times{flex:1 0 100%;margin:10px 0 2px 40px}
}
.task__time--free{font-family:var(--font-body);font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6);padding-top:7px}
.task--done .task__time{color:rgba(255,255,255,.45)}
.task__timeedit{width:104px;flex:none;padding:9px 10px;font-size:15px;align-self:center}
.task__body{flex:1;min-width:0}
.task__title{font-weight:600;word-break:break-word}
.task--done .task__title{text-decoration:line-through;color:rgba(255,255,255,.6)}
.task__meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.14)}
.tag--ess{background:var(--lime-400);color:var(--ink-950)}
.tag--imp{background:var(--blue-600)}
.tag--once{background:rgba(127,187,255,.22);color:var(--blue-300)}
.tag--steps{background:rgba(255,255,255,.16);color:#fff}
.tag--next{background:var(--lime-400);color:var(--ink-950)}
.tag--late{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.tag--restaura{background:rgba(182,246,90,.22);color:var(--lime-400)}
.tag--warn{background:rgba(255,194,74,.22);color:#FFD98A}
.now{display:flex;align-items:center;gap:10px;padding:10px 8px 6px}
.now span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-400);white-space:nowrap}
.now::after{content:"";flex:1;height:2px;background:var(--lime-400);opacity:.55;border-radius:2px}
.next-up{display:flex;gap:16px;align-items:center;border-left:6px solid var(--lime-400)}
.next-up__in{margin:0 0 0 auto;font-family:var(--font-display);font-size:15px;color:var(--lime-400);white-space:nowrap}
.next-up--live{border-left-color:var(--blue-500)}
.runbar{width:100%;height:8px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:12px;overflow:hidden}
.runbar i{display:block;height:100%;background:var(--lime-400);border-radius:4px}
.task__act{background:none;border:0;cursor:pointer;padding:6px;color:rgba(255,255,255,.7);border-radius:6px}
.task__act:hover{color:var(--lime-400)}
.task__act svg{width:18px;height:18px}

.later{border:2px dashed rgba(255,255,255,.3);border-radius:var(--radius);padding:18px;background:rgba(0,0,0,.14)}
.later li{margin-bottom:6px}

.empty{text-align:center;padding:30px 18px;border:2px dashed rgba(255,255,255,.28);border-radius:var(--radius)}
.empty p{margin:0 0 14px;color:rgba(255,255,255,.82)}

/* foco ------------------------------------------------------------ */
.focus{display:grid;gap:16px;align-items:center}
@media(min-width:560px){.focus{grid-template-columns:auto 1fr}}
.timer{font-family:var(--font-display);font-size:clamp(44px,12vw,64px);line-height:1;letter-spacing:-.02em;text-align:center}

/* premium lock ---------------------------------------------------- */
.locked{position:relative}
.locked__veil{
  position:absolute;inset:0;border-radius:var(--radius);
  background:rgba(4,17,60,.82);display:grid;place-items:center;text-align:center;padding:18px;gap:10px;
}
.locked__veil svg{width:26px;height:26px;margin:0 auto}
.locked__content{filter:blur(4px);opacity:.6;pointer-events:none;user-select:none}

/* gráfico --------------------------------------------------------- */
.chart{display:flex;align-items:flex-end;gap:8px;height:132px;margin-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart span{width:100%;background:var(--blue-500);border-radius:3px 3px 0 0;min-height:4px}
.chart .lbl{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.04em}
.chart .hi{background:var(--lime-400)}

/* calendário ------------------------------------------------------ */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.calhead h2{margin:0;flex:1;text-align:center;text-transform:capitalize}
.calnav{width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:none;cursor:pointer;font-size:18px;line-height:1}
.calnav:hover{border-color:var(--lime-400);color:var(--lime-400)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.7);padding-bottom:4px}
.calday{
  aspect-ratio:1;border-radius:9px;padding:0;cursor:pointer;position:relative;
  border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  font-weight:700;font-size:13.5px;color:rgba(255,255,255,.88);
  display:grid;place-items:center;
}
.calday.lvl1{background:rgba(182,246,90,.2);border-color:rgba(182,246,90,.4)}
.calday.lvl2{background:rgba(182,246,90,.5);border-color:rgba(182,246,90,.7);color:var(--ink-950)}
.calday.lvl3{background:var(--lime-400);border-color:var(--lime-400);color:var(--ink-950)}
.calday.today{border-color:var(--blue-500);border-width:2.5px}
.calday[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.calday .ci{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue-300)}
.calday.lvl2 .ci,.calday.lvl3 .ci{background:var(--ink-900)}
.calday.void{visibility:hidden}
.calday:disabled{opacity:.3;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.78)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1.5px solid rgba(255,255,255,.2)}
.daylog{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.daylog li{display:flex;gap:12px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.daylog li:last-child{border-bottom:0;padding-bottom:0}

<script>
"use strict";
/* ================================================================
   1. PERSISTÊNCIA — dados salvos no servidor, associados à conta
   ================================================================ */
const Store = {
  async save(state) {
    try {
      await fetch("/api/state", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ state })
      });
    } catch (e) {}
  }
};

/* ================================================================
   1b. AUTENTICAÇÃO — entrar / criar conta
   ================================================================ */
let authMode = "login";

function renderAuth(errorMsg) {
  const body = document.getElementById("authBody");
  body.innerHTML = `
    <div style="max-width:400px;margin:0 auto;width:100%">
      <a class="brand" href="index.html" style="margin-bottom:28px">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34V6h9l10 14V6h9v28h-9L15 20v14z" fill="#1B7BFF"/></svg>
        Neuro<em>Sync</em>
      </a>
      <h1 class="display d-l">${authMode === "login" ? "Entrar" : "Criar conta"}</h1>
      <p class="muted" style="margin:8px 0 24px">${authMode === "login"
        ? "Acesse sua rotina de qualquer dispositivo."
        : "Seus dados ficam guardados com segurança, associados ao seu e-mail."}</p>
      <form id="authForm" novalidate>
        ${authMode === "signup" ? `
        <div class="field">
          <label for="authName">Como quer ser chamado</label>
          <input class="input" id="authName" type="text" autocomplete="name" placeholder="Seu nome ou apelido">
        </div>` : ""}
        <div class="field">
          <label for="authEmail">E-mail</label>
          <input class="input" id="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required>
        </div>
        <div class="field">
          <label for="authPassword">Senha</label>
          <input class="input" id="authPassword" type="password" autocomplete="${authMode === "login" ? "current-password" : "new-password"}" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <p class="err" id="authErr">${errorMsg ? esc(errorMsg) : ""}</p>
        <button class="btn btn--lime btn--block" type="submit" id="authSubmit">${authMode === "login" ? "Entrar" : "Criar conta"}</button>
      </form>
      <p class="muted" style="text-align:center;margin-top:18px;font-size:14.5px">
        ${authMode === "login" ? "Ainda não tem conta?" : "Já tem conta?"}
        <button class="btn btn--ghost btn--sm" id="authToggle" type="button" style="margin-left:8px">${authMode === "login" ? "Criar conta" : "Entrar"}</button>
      </p>
    </div>`;

  document.getElementById("authToggle").addEventListener("click", () => {
    authMode = authMode === "login" ? "signup" : "login";
    renderAuth();
  });
  document.getElementById("authForm").addEventListener("submit", handleAuthSubmit);
  const first = document.getElementById(authMode === "signup" ? "authName" : "authEmail");
  if (first) first.focus({ preventScroll: true });
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const nameField = document.getElementById("authName");
  const name = nameField ? nameField.value.trim() : "";
  const submitBtn = document.getElementById("authSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Aguarde…";
  try {
    const res = await fetch(authMode === "login" ? "/api/login" : "/api/signup", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, name })
    });
    const data = await res.json();
    if (!res.ok) { renderAuth(data.error || "Algo deu errado."); return; }
    await afterAuth(data);
  } catch (err) {
    renderAuth("Não foi possível conectar ao servidor.");
  }
}

/** Campos que pertencem à conta (não ao blob de state) — sempre reaplicados após carregar/atualizar. */
function applyAccountMeta(account) {
  state.user.code = account.code || null;
  state.user.sponsoring = account.sponsoring || null;
  state.user.pendingInvite = account.pendingInvite || null;
  state.user.sponsoredBy = account.sponsoredBy || null;
}
/** Rebusca a conta no servidor (após uma ação de apadrinhamento) e repinta o Perfil. */
async function refreshAccountMeta() {
  try {
    const res = await fetch("/api/me", { credentials: "include" });
    if (res.ok) applyAccountMeta(await res.json());
  } catch (e) {}
}

async function afterAuth(account) {
  const saved = account.state;
  state = saved && saved.user ? migrate(Object.assign(blankState(), saved)) : blankState();
  applyAccountMeta(account);
  document.getElementById("authScreen").hidden = true;
  if (state.onboarded) {
    document.getElementById("onboarding").hidden = true;
    document.getElementById("app").hidden = false;
    paintChrome();
    const name = location.hash.replace("#/", "");
    go(RENDER[name] ? name : "hoje");
  } else {
    draft.email = account.email;
    draft.name = account.name || "";
    step = 0;
    document.getElementById("app").hidden = true;
    document.getElementById("onboarding").hidden = false;
    renderStep();
  }
}

function showAuth() {
  state = null;
  document.getElementById("app").hidden = true;
  document.getElementById("onboarding").hidden = true;
  authMode = "login";
  document.getElementById("authScreen").hidden = false;
  renderAuth();
}

/* ================================================================
   2. ESTADO
   ================================================================ */
const PERIODS = [
  { id: "manha", label: "Manhã", range: "06h – 12h", from: 0, to: 12 * 60 },
  { id: "tarde", label: "Tarde", range: "12h – 18h", from: 12 * 60, to: 18 * 60 },
  { id: "noite", label: "Noite", range: "18h – 24h", from: 18 * 60, to: 24 * 60 }
];
const COST = { restaura: -3, leve: 2, medio: 4, pesado: 7 };
const DUR = { restaura: 30, leve: 15, medio: 30, pesado: 60 };   // duração sugerida por custo
const WEEK = [
  { i: 0, letter: "D", short: "dom", label: "domingo" },
  { i: 1, letter: "S", short: "seg", label: "segunda-feira" },
  { i: 2, letter: "T", short: "ter", label: "terça-feira" },
  { i: 3, letter: "Q", short: "qua", label: "quarta-feira" },
  { i: 4, letter: "Q", short: "qui", label: "quinta-feira" },
  { i: 5, letter: "S", short: "sex", label: "sexta-feira" },
  { i: 6, letter: "S", short: "sáb", label: "sábado" }
];
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
const UTEIS = [1, 2, 3, 4, 5];
const FDS = [0, 6];
const COST_LABEL = { restaura: "Recarrega", leve: "Leve", medio: "Médio", pesado: "Pesado" };
const PRIO_LABEL = { essencial: "Essencial", importante: "Importante", opcional: "Opcional" };
const LEGACY_TIME = { manha: "09:00", tarde: "14:00", noite: "20:00" };
const CURVE = {
  autismo: [1, .9, .68], tdah: [.72, 1, .92], ambos: [.85, 1, .74], investigando: [.88, .95, .8]
};

let state = null;
let route = "hoje";

function blankState() {
  return {
    user: { name: "", email: "", profile: "investigando", wake: "07:00", sleep: "23:00", rhythm: 50, plan: "basico", tier: null, since: null },
    onboarded: false,
    tasks: [],
    checkins: [],
    focus: [],
    history: [],
    wearable: null
  };
}
const uid = () => Math.random().toString(36).slice(2, 9);
const isoDate = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => isoDate(new Date());
const fmtBR = (s) => (s ? s.split("-").reverse().join("/") : "—");
const toMin = (hm) => { const p = String(hm || "").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hhmm = (min) => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
const byTime = (a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || toMin(a.time) - toMin(b.time) || toMin(a.end) - toMin(b.end);
const taskDur = (t) => (t.time && t.end ? Math.max(0, toMin(t.end) - toMin(t.time)) : 0);
const fmtDur = (m) => (m >= 60 ? Math.floor(m / 60) + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : "") : m + " min");
const addMin = (hm, min) => hhmm(Math.min(23 * 60 + 59, toMin(hm) + min));
const sameDays = (a, b) => a.length === b.length && b.every(d => a.includes(d));
const daysOf = (t) => (Array.isArray(t.days) ? t.days : ALL_DAYS);
/** A tarefa de rotina acontece neste dia da semana? */
const runsOn = (t, weekday) => t.kind !== "rotina" || daysOf(t).includes(weekday);
function daysLabel(days) {
  if (sameDays(days, ALL_DAYS)) return "Todo dia";
  if (sameDays(days, UTEIS)) return "Dias úteis";
  if (sameDays(days, FDS)) return "Fim de semana";
  return WEEK.filter(d => days.includes(d.i)).map(d => d.short).join(", ");
}
/** Ids de tarefas que se sobrepõem no relógio (lista ordenada por início). */
function overlapIds(list) {
  const set = new Set();
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (!a.end) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j];
      if (toMin(b.time) < toMin(a.end)) { set.add(a.id); set.add(b.id); } else break;
    }
  }
  return set;
}
/** Tarefa de rotina zera todo dia; tarefa solta é feita uma vez só. */
const isDone = (t) => (t.kind === "avulsa" ? !!t.done : t.lastDone === today());
const stepsOf = (t) => (Array.isArray(t.steps) ? t.steps : []);
const stepDone = (t, s) => (t.kind === "avulsa" ? !!s.doneAt : s.doneAt === today());
const stepProgress = (t) => {
  const list = stepsOf(t);
  return { total: list.length, done: list.filter(s => stepDone(t, s)).length };
};
/** Registra/desfaz a conclusão sem alternar (usado pelos passos). */
function setDone(t, done) {
  const d = today();
  if (t.kind === "avulsa") { t.done = done; t.doneAt = done ? d : null; }
  else { t.lastDone = done ? d : null; }
  if (done) {
    if (!state.history.some(h => h.taskId === t.id && h.date === d)) {
      state.history.push({ date: d, at: hhmm(nowMin()), taskId: t.id, title: t.title, kind: t.kind, cost: t.cost });
    }
  } else {
    state.history = state.history.filter(h => !(h.taskId === t.id && h.date === d));
  }
}

/** Checkbox da tarefa: leva todos os passos junto. */
function toggleDone(t) {
  const done = !isDone(t);
  setDone(t, done);
  stepsOf(t).forEach(s => { s.doneAt = done ? today() : null; });
  return done;
}

/** Checkbox de um passo: o último passo fecha a tarefa, desmarcar reabre. */
function toggleStep(t, stepId) {
  const s = stepsOf(t).find(x => x.id === stepId);
  if (!s) return false;
  s.doneAt = stepDone(t, s) ? null : today();
  const p = stepProgress(t);
  if (p.total && p.done === p.total) setDone(t, true);
  else if (isDone(t)) setDone(t, false);
  return stepDone(t, s);
}
const doneOn = (iso) => state.history.filter(h => h.date === iso);
const focusOn = (iso) => state.focus.filter(f => f.date === iso);
/** Dias seguidos com ao menos uma tarefa concluída. */
function streak() {
  const d = new Date();
  if (!doneOn(isoDate(d)).length) d.setDate(d.getDate() - 1);
  let n = 0;
  while (doneOn(isoDate(d)).length) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
/** Migra tarefas antigas (blocos manhã/tarde/noite) para o novo modelo. */
function migrate(st) {
  (st.tasks || []).forEach(t => {
    if (t.end === undefined) t.end = "";
    if (t.kind === "rotina" && !Array.isArray(t.days)) t.days = ALL_DAYS.slice();
    if (t.kind) return;
    t.kind = "rotina";
    t.days = ALL_DAYS.slice();
    t.time = LEGACY_TIME[t.block] || "";
    t.lastDone = t.done ? today() : null;
    delete t.block; delete t.done;
  });

  if (!Array.isArray(st.history)) {
    st.history = [];
    (st.tasks || []).forEach(t => {
      const d = t.kind === "avulsa" ? t.doneAt : t.lastDone;
      if (d) st.history.push({ date: d, at: "", taskId: t.id, title: t.title, kind: t.kind, cost: t.cost });
    });
  }
  return st;
}

const brl = (n) => "R$ " + n.toFixed(2).replace(".", ",");

/* ================================================================
   3. CÉREBRO DIGITAL — capacidade e adaptação da rotina
   ================================================================ */
function checkinOf(date) { return state.checkins.find(c => c.date === date) || null; }

function capacity(c) {
  if (!c) return { points: 14, level: 3, source: "estimado" };
  let pts = c.energy * 4;
  pts += c.sleep >= 7 ? 2 : c.sleep >= 5 ? 0 : -2;
  pts -= (c.overload - 1);
  pts += c.mood >= 4 ? 1 : (c.mood <= 2 ? -1 : 0);
  return { points: Math.max(4, Math.min(24, Math.round(pts))), level: c.energy, source: "check-in" };
}

const ENERGY_TEXT = {
  1: { title: "Dia de proteger o essencial", msg: "Deixei só o mínimo em pé. O resto espera, e tudo bem." },
  2: { title: "Dia curto de bateria", msg: "Priorizei o essencial e um pouco do importante." },
  3: { title: "Dia possível", msg: "Dá para manter o essencial e avançar no que importa." },
  4: { title: "Dia bom", msg: "Sua rotina cabe inteira e ainda sobra espaço." },
  5: { title: "Dia de pico", msg: "Aproveite: incluí até o que é opcional." }
};

/** Distribui as tarefas do dia dentro do orçamento de energia. */
/** Tarefas que entram no dia de hoje. */
function todayList() {
  const t0 = today();
  const weekday = new Date().getDay();
  return state.tasks.filter(t => {
    if (t.kind === "rotina") return runsOn(t, weekday);
    if (t.done) return t.doneAt === t0;
    return !t.date || t.date <= t0;
  });
}

/** Distribui as tarefas do dia dentro do orçamento de energia. */
function planDay() {
  const c = checkinOf(today());
  const cap = capacity(c);
  const order = { essencial: 0, importante: 1, opcional: 2 };
  const list = todayList().slice()
    // tarefas que recarregam entram primeiro: a energia que elas dão abre espaço para o resto do dia
    .sort((a, b) => Math.sign(COST[a.cost]) - Math.sign(COST[b.cost])
      || (order[a.priority] - order[b.priority]) || (COST[a.cost] - COST[b.cost]));

  let used = 0;
  const active = [], later = [];
  list.forEach(t => {
    if (isDone(t)) { active.push(t); return; }
    const cost = COST[t.cost];
    if (t.priority === "essencial" || cost <= 0 || used + cost <= cap.points) { used += cost; active.push(t); }
    else later.push(t);
  });
  return { cap, active, later, used, overloaded: used > cap.points };
}

function dayCurve() {
  const c = checkinOf(today());
  const base = c ? c.energy : 3;
  const mult = CURVE[state.user.profile] || CURVE.investigando;
  return mult.map(m => Math.max(1, Math.min(5, Math.round(base * m * 10) / 10)));
}

function renderStep() {
  const body = document.getElementById("onbBody");

  document.getElementById("onbNext").textContent = step === steps.length - 1 ? "Criar minha rotina" : "Continuar";
  const bar = document.getElementById("onbBar");
  [...bar.children].forEach((i, idx) => i.classList.toggle("on", idx <= step));
  bar.setAttribute("aria-valuenow", String(step + 1));

  if (step === 3) {
    const r = document.getElementById("obRhythm");
    const out = document.getElementById("rhythmOut");
    const say = () => {
      const v = +r.value;
      out.textContent = v <= 30 ? "Blocos fixos, mudanças sempre avisadas."
        : v >= 70 ? "Blocos soltos, o app reorganiza quando o dia virar."
        : "Estrutura no essencial, liberdade no resto.";
    };
    r.addEventListener("input", say); say();
  }
  const first = body.querySelector("input");
  if (first && step > 0) first.focus({ preventScroll: true });
}

function collectStep() {
  if (step === 1) {
    const n = document.getElementById("obName");
    draft.name = n.value.trim();
    if (draft.name.length < 2) {
      document.getElementById("errName").textContent = "Escreva ao menos 2 letras.";
      n.setAttribute("aria-invalid", "true"); n.focus();
      return false;
    }
    document.getElementById("errName").textContent = ""; n.removeAttribute("aria-invalid");
    return true;
  }
  if (step === 2) {
    const sel = document.querySelector('input[name="profile"]:checked');
    if (!sel) { document.getElementById("errProfile").textContent = "Escolha a opção mais próxima de você."; return false; }
    draft.profile = sel.value; return true;
  }
  if (step === 3) {
    draft.wake = document.getElementById("obWake").value || "07:00";
    draft.sleep = document.getElementById("obSleep").value || "23:00";
    draft.rhythm = +document.getElementById("obRhythm").value;
    return true;

  if (step === 4) {
    draft.tasks = [...document.querySelectorAll("#obTasks input:checked")].map(i => +i.value);
    return true;
  }
  return true;
}

  bindTasks(document.getElementById("screen-hoje"));

/** Existe tarefa pesada marcada fora da melhor janela de energia? */
function heavyOutOfWindow(timed, curve) {
  const best = PERIODS[curve.indexOf(Math.max(...curve))];
  return timed.some(t => t.cost === "pesado" && !isDone(t) && (toMin(t.time) < best.from || toMin(t.time) >= best.to));
}

/** Existe tarefa pesada marcada fora da melhor janela de energia? */
function heavyOutOfWindow(timed, curve) {
  const best = PERIODS[curve.indexOf(Math.max(...curve))];
  return timed.some(t => t.cost === "pesado" && !isDone(t) && (toMin(t.time) < best.from || toMin(t.time) >= best.to));
}

function focusMinutes(lvl) { return lvl <= 1 ? 10 : lvl === 2 ? 15 : lvl === 3 ? 25 : lvl === 4 ? 35 : 45; }

/* ---------- timer de foco ---------- */
let timerId = null, timerLeft = 0, timerRunning = false, timerMinutes = 25;
let focusTask = null;      // id da tarefa em foco (null = foco livre)
const expanded = new Set();  // tarefas com os passos abertos na lista
function stopTimer() { clearInterval(timerId); timerId = null; timerRunning = false; }
function paintTimer() {
  const out = document.getElementById("timerOut");
  if (!out) return;
  const m = Math.floor(Math.max(0, timerLeft) / 60), s = Math.max(0, timerLeft) % 60;
  out.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
async function tick() {
  timerLeft--; paintTimer();
  if (timerLeft > 0) return;
  stopTimer();
  const t = focusTask ? state.tasks.find(x => x.id === focusTask) : null;
  state.focus.push({ date: today(), minutes: timerMinutes, taskId: t ? t.id : null, title: t ? t.title : "" });
  await persist();
  toast(t ? 'Sessão concluída em "' + t.title + '".' : "Sessão de foco concluída. Faça uma pausa de verdade.");
  if (route === "hoje") renderHoje();
}
function bindTimer(minutes) {
  const start = document.getElementById("timerStart");
  const reset = document.getElementById("timerReset");
  if (!start) return;
  if (!timerRunning) { timerMinutes = minutes; timerLeft = minutes * 60; }
  paintTimer();
  start.textContent = timerRunning ? "Pausar" : (timerLeft === timerMinutes * 60 ? "Iniciar foco" : "Retomar");
  start.onclick = () => {
    if (timerRunning) { clearInterval(timerId); timerId = null; timerRunning = false; start.textContent = "Retomar"; return; }
    timerRunning = true; start.textContent = "Pausar";
    timerId = setInterval(tick, 1000);
  };
  reset.onclick = () => {
    clearInterval(timerId); timerId = null; timerRunning = false;
    timerLeft = timerMinutes * 60; paintTimer(); start.textContent = "Iniciar foco";
  };
}

/** Monta os campos com um prefixo de id, preenchidos por `t`. */
let stepDraft = { nt: [], ed: [] };

    <div class="field">

      </div>
      <div class="presets">
        <button class="btn btn--ghost btn--sm" type="button" data-preset="todos">Todo dia</button>
        <button class="btn btn--ghost btn--sm" type="button" data-preset="uteis">Dias úteis</button>

          <option value="importante" ${sel(prio, "importante")}>Importante</option>

/** Desenha a lista editável de passos e religa os controles. */
function renderStepList(p, root) {
  const ul = root.querySelector("#" + p + "Steps");
  const list = stepDraft[p];
  ul.innerHTML = list.length
    ? list.map((s, i) => `<li>
        <input class="input" type="text" maxlength="80" data-i="${i}" value="${esc(s.title)}" placeholder="Passo ${i + 1}" aria-label="Passo ${i + 1}">
        <button class="stepbtn" type="button" data-move="-1" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Subir passo ${i + 1}">↑</button>
        <button class="stepbtn" type="button" data-move="1" data-i="${i}" ${i === list.length - 1 ? "disabled" : ""} aria-label="Descer passo ${i + 1}">↓</button>
        <button class="stepbtn" type="button" data-del="${i}" aria-label="Remover passo ${i + 1}">✕</button>
      </li>`).join("")
    : `<li><p class="muted" style="margin:0;font-size:14px">Nenhum passo. A tarefa funciona normalmente sem eles.</p></li>`;

  ul.querySelectorAll("input[data-i]").forEach(inp => inp.addEventListener("input", () => {
    list[+inp.dataset.i].title = inp.value;
  }));
  ul.querySelectorAll("[data-move]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i, j = i + +b.dataset.move;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    renderStepList(p, root);
    const focusBtn = root.querySelector(`#${p}Steps li:nth-child(${j + 1}) [data-move="${b.dataset.move}"]`);
    if (focusBtn) focusBtn.focus({ preventScroll: true });
  }));
  ul.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    list.splice(+b.dataset.del, 1);
    renderStepList(p, root);
    root.querySelector("#" + p + "AddStep").focus({ preventScroll: true });
  }));
}

/** Liga os comportamentos dinâmicos dos campos (tipo, presets, duração). */
function bindTaskFields(p, root) {
  root = root || document;
  const el = (id) => root.querySelector("#" + p + id);
  const time = el("Time"), end = el("End"), cost = el("Cost"), out = el("DurOut");
  let endTouched = !!(end && end.value);

  const showDur = () => {
    if (!time.value || !end.value) { out.textContent = "Preenche sozinho pelo custo."; return; }
    const d = toMin(end.value) - toMin(time.value);
    out.textContent = d > 0 ? "Duração: " + fmtDur(d) : "O término precisa ser depois do início.";
  };
  const suggest = () => {
    if (!time.value) { end.value = ""; showDur(); return; }
    if (!endTouched || !end.value) end.value = addMin(time.value, DUR[cost.value]);
    showDur();
  };
  end.addEventListener("input", () => { endTouched = true; showDur(); });
  time.addEventListener("change", suggest);
  cost.addEventListener("change", suggest);
  showDur();

  root.querySelectorAll(`input[name="${p}Kind"]`).forEach(r => r.addEventListener("change", () => {
    const avulsa = root.querySelector(`input[name="${p}Kind"]:checked`).value === "avulsa";
    el("DateWrap").hidden = !avulsa;
    el("DaysWrap").hidden = avulsa;
  }));

  renderStepList(p, root);
  el("AddStep").addEventListener("click", () => {
    stepDraft[p].push({ id: uid(), title: "", doneAt: null });
    renderStepList(p, root);
    const inputs = root.querySelectorAll("#" + p + "Steps input");
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  el("DaysWrap").querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    const set = b.dataset.preset === "uteis" ? UTEIS : b.dataset.preset === "fds" ? FDS : ALL_DAYS;
    el("Days").querySelectorAll("input").forEach(i => { i.checked = set.includes(+i.value); });
    el("ErrDays").textContent = "";
  }));
}

/** Lê e valida os campos. Retorna null (e foca o erro) quando inválido. */
function readTaskFields(p, root) {
  root = root || document;
  const el = (id) => root.querySelector("#" + p + id);
  const title = el("Title").value.trim();
  const errTitle = el("ErrTitle"), errDays = el("ErrDays");
  errTitle.textContent = ""; errDays.textContent = "";
  el("Title").removeAttribute("aria-invalid");

  if (title.length < 2) {
    errTitle.textContent = "Escreva o que precisa acontecer.";
    el("Title").setAttribute("aria-invalid", "true"); el("Title").focus(); return null;
  }
  const kind = root.querySelector(`input[name="${p}Kind"]:checked`).value;
  const days = [...el("Days").querySelectorAll("input:checked")].map(i => +i.value).sort((a, b) => a - b);
  if (kind === "rotina" && !days.length) {
    errDays.textContent = "Escolha ao menos um dia da semana.";
    el("Days").querySelector("input").focus(); return null;
  }
  const start = el("Time").value || "";
  const end = el("End").value || "";
  if (end && !start) { errTitle.textContent = "Defina também o horário de início."; el("Time").focus(); return null; }
  if (start && end && toMin(end) <= toMin(start)) {
    errTitle.textContent = "O término precisa ser depois do início."; el("End").focus(); return null;
  }
  const steps = stepDraft[p].filter(x => x.title.trim()).map(x => ({ id: x.id, title: x.title.trim(), doneAt: x.doneAt || null }));

  return {
    title, kind, days, steps,
    time: start, end: start ? end : "",
    date: el("Date").value || today(),
    priority: el("Prio").value,
    cost: el("Cost").value
  };
}

/** Abre a folha de edição completa de uma tarefa já existente. */
function openTaskEditor(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  sheetFocus = document.activeElement;
  document.body.style.overflow = "hidden";
  document.getElementById("sheetRoot").innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitleHead">
      <button class="sheet__veil" type="button" aria-label="Fechar edição"></button>
      <div class="sheet__panel">
        <button class="sheet__close" type="button" aria-label="Fechar">✕</button>
        <h2 class="display d-l" id="edTitleHead">Editar tarefa</h2>
        <p class="muted" style="margin:10px 0 20px;font-size:14.5px">Dá para mudar tudo, inclusive transformar uma tarefa de rotina em solta e vice-versa.</p>
        ${taskFields("ed", t)}
        <button class="btn btn--lime btn--block" id="edSave" type="button" style="margin-top:6px">Salvar alterações</button>
        <button class="btn btn--ghost btn--block" id="edCancel" type="button" style="margin-top:10px">Cancelar</button>
        <button class="btn btn--danger btn--block" id="edDelete" type="button" style="margin-top:10px">Apagar tarefa</button>
      </div>
    </div>`;

  const root = document.getElementById("sheetRoot");
  root.querySelector(".sheet__veil").addEventListener("click", closeSheet);
  root.querySelector(".sheet__close").addEventListener("click", closeSheet);
  root.querySelector("#edCancel").addEventListener("click", closeSheet);
  document.removeEventListener("keydown", sheetKeys);
  document.addEventListener("keydown", sheetKeys);
  bindTaskFields("ed", root);

  let armed = false;
  const del = root.querySelector("#edDelete");
  del.addEventListener("click", async () => {
    if (!armed) {
      armed = true; del.textContent = "Tocar de novo para apagar";
      setTimeout(() => { armed = false; del.textContent = "Apagar tarefa"; }, 5000);
      return;
    }
    state.tasks = state.tasks.filter(x => x.id !== id);
    await persist(); closeSheet(); toast("Tarefa apagada.", "info");
    route === "hoje" ? renderHoje() : renderRotina();
  });

  root.querySelector("#edSave").addEventListener("click", async () => {
    const data = readTaskFields("ed", root);
    if (!data) return;
    const wasDoneToday = isDone(t);

    t.title = data.title;
    t.time = data.time; t.end = data.end;
    t.priority = data.priority; t.cost = data.cost;
    t.steps = data.steps;

    if (data.kind === "rotina") {
      t.kind = "rotina"; t.days = data.days;
      t.lastDone = wasDoneToday ? today() : (t.lastDone || null);
      delete t.done; delete t.doneAt; delete t.date;
    } else {
      t.kind = "avulsa"; t.date = data.date;
      t.done = wasDoneToday; t.doneAt = wasDoneToday ? today() : null;
      delete t.days; delete t.lastDone;
    }

    const pr = stepProgress(t);
    if (pr.total && pr.done === pr.total) setDone(t, true);
    else if (pr.total && isDone(t) && pr.done < pr.total) setDone(t, false);

    await persist(); closeSheet(); toast("Tarefa atualizada.");
    route === "hoje" ? renderHoje() : renderRotina();
  });

  const h = root.querySelector("h2");
  h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true });
}

/* ---------- ROTINA ---------- */

          : `<p class="muted" style="padding:16px 18px;margin:0;font-size:14.5px">Nenhuma pendência avulsa. Use para o que aparece uma vez só: consulta, boleto, ligar para alguém.</p>`}

  });

async function addTask() {
  const data = readTaskFields("nt");
  if (!data) return;

  const task = {
    id: uid(), title: data.title, kind: data.kind,
    time: data.time, end: data.end,
    priority: data.priority, cost: data.cost,
    created: today()
  };
  task.steps = data.steps;
  if (data.kind === "avulsa") { task.done = false; task.doneAt = null; task.date = data.date; }
  else { task.lastDone = null; task.days = data.days; }

  state.tasks.push(task);
  await persist();
  toast(data.kind === "avulsa" ? "Tarefa solta anotada." : "Na rotina: " + daysLabel(data.days).toLowerCase() + ".");
  renderRotina();
  document.getElementById("ntTitle").focus();
}

function bindTasks(root) {
  root.querySelectorAll(".task").forEach(li => {
    const id = li.dataset.id;
    const refresh = () => (route === "hoje" ? renderHoje() : renderRotina());

    li.querySelector('[data-act="toggle"]').addEventListener("click", async () => {
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      const done = toggleDone(t); await persist();
      if (done) toast(t.kind === "avulsa" ? "Feito e fora da lista." : "Feito. Isso contou.");
      refresh();
    });

    li.querySelector('[data-act="edit"]').addEventListener("click", () => openTaskEditor(id));

    const exp = li.querySelector('[data-act="steps"]');
    if (exp) exp.addEventListener("click", () => {
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      refresh();
      const btn = document.querySelector(`.task[data-id="${id}"] [data-act="steps"]`);
      if (btn) btn.focus({ preventScroll: true });
    });

    li.querySelectorAll('[data-act="step"]').forEach(b => b.addEventListener("click", async () => {
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      const wasDone = isDone(t);
      toggleStep(t, b.dataset.step);
      await persist();
      const p = stepProgress(t);
      if (!wasDone && isDone(t)) toast("Todos os passos feitos. Tarefa concluída.");
      else if (p.done < p.total) toast(p.done + " de " + p.total + " passos.", "info");
      refresh();
    }));

    const foc = li.querySelector('[data-act="focus"]');
    if (foc) foc.addEventListener("click", () => {
      stopTimer();
      focusTask = id;
      renderHoje();
      const pick = document.getElementById("focusPick");
      if (pick) { pick.scrollIntoView({ block: "center" }); pick.focus({ preventScroll: true }); }
      const t = state.tasks.find(x => x.id === id);
      if (t) toast('Foco em "' + t.title + '".', "info");
    });

    li.querySelectorAll('[data-act="day"]').forEach(btn => btn.addEventListener("click", async () => {
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      const d = +btn.dataset.day;
      const days = daysOf(t).slice();
      const i = days.indexOf(d);
      if (i >= 0) {
        if (days.length === 1) { toast("A tarefa precisa de pelo menos um dia.", "info"); return; }
        days.splice(i, 1);
      } else days.push(d);
      t.days = days.sort((a, b) => a - b);
      await persist();
      toast(esc(t.title) + ": " + daysLabel(t.days).toLowerCase() + ".", "info");
      refresh();
    }));

    const startEl = li.querySelector('[data-act="time"]');
    const endEl = li.querySelector('[data-act="end"]');

    if (startEl) startEl.addEventListener("change", async () => {
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      t.time = startEl.value || "";
      if (!t.time) { t.end = ""; toast("Agora é 'quando der'.", "info"); }
      else {
        if (!t.end || toMin(t.end) <= toMin(t.time)) t.end = addMin(t.time, DUR[t.cost]);
        toast("Começa às " + t.time + ", termina às " + t.end + ".", "info");
      }
      await persist(); refresh();
    });

    if (endEl) endEl.addEventListener("change", async () => {
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      const v = endEl.value || "";
      if (v && !t.time) { endEl.value = ""; toast("Defina primeiro o horário de início.", "info"); return; }
      if (v && toMin(v) <= toMin(t.time)) {
        endEl.value = t.end || "";
        toast("O término precisa ser depois do início.", "info"); return;
      }
      t.end = v; await persist();
      toast(v ? "Termina às " + v + " (" + fmtDur(taskDur(t)) + ")." : "Término removido.", "info");
      refresh();
    });
  });
}

          ${scale("mood", c.mood, ["Difícil", "Pra baixo", "Neutro", "Bom", "Ótimo"])}
        </fieldset>
        <fieldset>
          <legend>Sobrecarga sensorial</legend>
          ${scale("overload", c.overload, ["Nenhuma", "Leve", "Média", "Alta", "No limite"])}
        </fieldset>
        <div class="field">
          <label for="ciSleep">Horas de sono na última noite</label>

      </div>

        <h2 class="display d-m">Últimos 7 dias</h2>
        ${last7.some(d => d.value) ? `
          <div class="chart" role="img" aria-label="Energia registrada nos últimos sete dias">
            ${last7.map(d => `<div><span class="${d.value >= 4 ? "hi" : ""}" style="height:${d.value ? (d.value / 5) * 100 : 3}%"></span><span class="lbl">${d.label}</span></div>`).join("")}
          </div>
          <p class="muted" style="font-size:14px;margin:12px 0 0">Média de energia: <strong>${avgEnergy().toFixed(1)}</strong> de 5.</p>`
        : `<p class="muted" style="margin:8px 0 0">Seu histórico aparece aqui a partir do primeiro check-in.</p>`}
      </div>
    </div>`;

  document.getElementById("saveCheckin").addEventListener("click", saveCheckin);
}

function lastNCheckins(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = isoDate(d);
    const c = state.checkins.find(x => x.date === iso);
    out.push({ label: d.toLocaleDateString("pt-BR", { weekday: "narrow" }), value: c ? c.energy : 0 });
  }
  return out;
}
function avgEnergy() {
  if (!state.checkins.length) return 0;
  return state.checkins.reduce((s, c) => s + c.energy, 0) / state.checkins.length;
}

async function saveCheckin() {
  const val = n => { const el = document.querySelector(`input[name="${n}"]:checked`); return el ? +el.value : 3; };
  const rec = {
    date: today(), energy: val("energy"), mood: val("mood"), overload: val("overload"),
    sleep: Math.max(0, Math.min(16, parseFloat(document.getElementById("ciSleep").value) || 0)),
    note: document.getElementById("ciNote").value.trim().slice(0, 400)
  };
  state.checkins = state.checkins.filter(c => c.date !== rec.date).concat(rec);
  await persist();
  const cap = capacity(rec);
  toast(`Rotina ajustada: ${cap.points} pontos de energia hoje.`);
  go("hoje");
}

/* ---------- HISTÓRICO (calendário) ---------- */
let cal = { y: null, m: null, sel: null };
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

function renderHistorico() {
  const now = new Date();
  if (cal.y === null) { cal.y = now.getFullYear(); cal.m = now.getMonth(); }
  const days = new Date(cal.y, cal.m + 1, 0).getDate();
  const offset = new Date(cal.y, cal.m, 1).getDay();
  const todayISO = today();

  let monthDone = 0, monthMin = 0, monthCheck = 0, activeDays = 0;
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push('<button class="calday void" type="button" tabindex="-1" aria-hidden="true"></button>');
  for (let d = 1; d <= days; d++) {
    const iso = isoDate(new Date(cal.y, cal.m, d));
    const done = doneOn(iso).length;
    const mins = focusOn(iso).reduce((sum, f) => sum + f.minutes, 0);
    const check = !!state.checkins.find(c => c.date === iso);
    monthDone += done; monthMin += mins;
    if (check) monthCheck++;
    if (done) activeDays++;
    const lvl = done === 0 ? "" : done <= 2 ? "lvl1" : done <= 4 ? "lvl2" : "lvl3";
    cells.push(`<button class="calday ${lvl} ${iso === todayISO ? "today" : ""}" type="button"
      data-day="${iso}" aria-pressed="${cal.sel === iso}" ${iso > todayISO ? "disabled" : ""}
      aria-label="${d} de ${MONTHS[cal.m]}: ${done} ${done === 1 ? "tarefa concluída" : "tarefas concluídas"}${check ? ", com check-in" : ""}">
      ${d}${check ? '<span class="ci"></span>' : ""}</button>`);
  }

  const sel = cal.sel;
  const selDone = sel ? doneOn(sel) : [];
  const selCheck = sel ? state.checkins.find(c => c.date === sel) : null;
  const selMin = sel ? focusOn(sel).reduce((sum, f) => sum + f.minutes, 0) : 0;
  const seq = streak();

  document.getElementById("screen-historico").innerHTML = `
    <div class="screen__head">
      <p class="eyebrow">Histórico</p>
      <h1 class="display d-xl" id="tit-historico">O que você<br><span class="t-lime">já fez</span></h1>
      <div class="rule rule--lime" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="muted" style="margin-top:16px">Registro do que foi concluído — não do que ficou para trás.</p>
    </div>

    <div class="stack">
      <div class="card">
        <div class="calhead">
          <button class="calnav" id="calPrev" type="button" aria-label="Mês anterior">‹</button>
          <h2 class="display d-m" aria-live="polite">${MONTHS[cal.m]} ${cal.y}</h2>
          <button class="calnav" id="calNext" type="button" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal" role="group" aria-label="Calendário de ${MONTHS[cal.m]} de ${cal.y}">
          ${WEEK.map(d => `<div class="dow">${d.letter}</div>`).join("")}
          ${cells.join("")}
        </div>
        <div class="legend">
          <span><i style="background:rgba(255,255,255,.05)"></i>nada</span>
          <span><i style="background:rgba(182,246,90,.2)"></i>1 a 2</span>
          <span><i style="background:rgba(182,246,90,.5)"></i>3 a 4</span>
          <span><i style="background:var(--lime-400)"></i>5 ou mais</span>
          <span><i style="background:var(--blue-300);border-radius:50%;width:8px;height:8px"></i>dia com check-in</span>
        </div>
        <div class="kpis">
          <div class="kpi"><b>${monthDone}</b><span>concluídas no mês</span></div>
          <div class="kpi"><b>${activeDays}</b><span>dias com atividade</span></div>
          <div class="kpi"><b>${monthCheck}</b><span>check-ins</span></div>
          <div class="kpi"><b>${monthMin ? fmtDur(monthMin) : "0"}</b><span>de foco</span></div>
        </div>
      </div>

      <div class="card card--deep">
        <h2 class="display d-m">${sel ? fmtBR(sel) : "Escolha um dia"}</h2>
        ${!sel ? `<p class="muted" style="margin:10px 0 0;font-size:14.5px">Toque em qualquer dia do calendário para ver o que aconteceu nele.</p>` : `
          ${selCheck ? `<p class="muted" style="margin:10px 0 0;font-size:14.5px">
              Energia ${selCheck.energy}/5 · humor ${selCheck.mood}/5 · sobrecarga ${selCheck.overload}/5 · ${selCheck.sleep}h de sono
              ${selCheck.note ? `<br><em>"${esc(selCheck.note)}"</em>` : ""}
            </p>` : `<p class="muted" style="margin:10px 0 0;font-size:14.5px">Sem check-in nesse dia.</p>`}
          ${selMin ? `<p class="muted" style="margin:8px 0 0;font-size:14.5px">${fmtDur(selMin)} em sessões de foco.</p>` : ""}
          ${selDone.length
            ? `<ul class="daylog">${selDone.map(h => `<li><b>${h.at || "—"}</b><span>${esc(h.title)} <span class="tag">${COST_LABEL[h.cost] || ""}</span></span></li>`).join("")}</ul>`
            : `<p class="muted" style="margin:14px 0 0;font-size:14.5px">Nenhuma tarefa concluída. Dias assim também fazem parte.</p>`}
        `}
      </div>

      <div class="card">
        <div class="between"><h2 class="display d-m">Sequência atual</h2><span class="chip chip--lime">${seq} ${seq === 1 ? "dia" : "dias"}</span></div>
        <p class="muted" style="margin:10px 0 0;font-size:14.5px">
          Dias seguidos com pelo menos uma tarefa concluída. Perder um dia zera o contador, não o seu valor —
          ele recomeça na primeira tarefa que você marcar.
        </p>
      </div>
    </div>`;

  document.getElementById("calPrev").addEventListener("click", () => {
    cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; }
    cal.sel = null; renderHistorico();
  });
  document.getElementById("calNext").addEventListener("click", () => {
    cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; }
    cal.sel = null; renderHistorico();
  });
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    cal.sel = cal.sel === b.dataset.day ? null : b.dataset.day;
    renderHistorico();
  }));
}

function renderSheet() {

  root.innerHTML = `

function sheetKeys(e) {
  const panel = document.querySelector(".sheet__panel");
  if (!panel) { document.removeEventListener("keydown", sheetKeys); return; }
  if (e.key === "Escape") { closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = [...panel.querySelectorAll('button,input,select,textarea,a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function qrSVG(seed) {
  let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const n = 21, cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    h = (h * 1103515245 + 12345) >>> 0;
    const corner = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    if (corner) continue;
    if ((h >> 16) % 2) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  }
  const eye = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#04113C" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 21 21" width="150" height="150" fill="#04113C" role="img" aria-label="QR Code Pix de demonstração">
    <rect width="21" height="21" fill="#fff"/>${cells.join("")}${eye(0, 0)}${eye(14, 0)}${eye(0, 14)}</svg>`;
}

function luhn(v) {
  const s = v.replace(/\D/g, ""); if (s.length < 13) return false;
  let sum = 0, alt = false;
  for (let i = s.length - 1; i >= 0; i--) {
    let d = +s[i];
    if (alt) { d *= 2; if (d > 9) d -= 9; }
    sum += d; alt = !alt;
  }
  return sum % 10 === 0;
}
function cpfValid(v) {
  const s = v.replace(/\D/g, "");
  if (s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
  for (let t = 9; t < 11; t++) {
    let sum = 0;
    for (let i = 0; i < t; i++) sum += +s[i] * (t + 1 - i);
    let d = (sum * 10) % 11; if (d === 10) d = 0;
    if (d !== +s[t]) return false;
  }
  return true;
}
function setErr(id, msg, input) {
  const e = document.getElementById(id); if (e) e.textContent = msg || "";
  if (input) msg ? input.setAttribute("aria-invalid", "true") : input.removeAttribute("aria-invalid");
  return !msg;
}
function validatePayment() {
  if (ck.method === "pix") return true;
  const name = document.getElementById("cardName"), num = document.getElementById("cardNum"),
        exp = document.getElementById("cardExp"), cvv = document.getElementById("cardCvv"),
        cpf = document.getElementById("cardCpf");
  let ok = true, firstBad = null;
  const check = (cond, id, msg, el) => { const good = setErr(id, cond ? "" : msg, el); if (!good) { ok = false; if (!firstBad) firstBad = el; } };

  check(name.value.trim().length >= 3, "errCardName", "Escreva o nome como está no cartão.", name);
  check(luhn(num.value), "errCardNum", "Número inválido. Para testar, use 4242 4242 4242 4242.", num);

  const m = /^(\d{2})\/(\d{2})$/.exec(exp.value);
  let expOk = false;
  if (m) {
    const mm = +m[1], yy = 2000 + +m[2], now = new Date();
    expOk = mm >= 1 && mm <= 12 && new Date(yy, mm, 0) >= new Date(now.getFullYear(), now.getMonth(), 1);
  }
  check(expOk, "errCardExp", "Use MM/AA, com data futura.", exp);
  check(/^\d{3,4}$/.test(cvv.value), "errCardCvv", "3 ou 4 dígitos.", cvv);
  check(cpfValid(cpf.value), "errCardCpf", "CPF inválido.", cpf);

  ck.card = { name: name.value.trim(), num: num.value, exp: exp.value, cvv: cvv.value, cpf: cpf.value };
  if (!ok && firstBad) firstBad.focus();
  return ok;
}

    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) { err(data && data.error); toast(data && data.error ? data.error : "Não foi possível concluir.", "info"); return; }
    await refreshAccountMeta(); paintChrome(); renderPerfil();
  };

  const invite = document.getElementById("sponsorInvite");
  if (invite) invite.addEventListener("click", async () => {
    const code = document.getElementById("sponsorCode").value.trim().toUpperCase();
    if (!code) { err("Peça o ID pro seu amigo, em Perfil."); return; }
    invite.disabled = true;
    try {
      await after(await fetch("/api/sponsor/invite", {
        method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      }));
    } catch (e) { err("Não foi possível conectar ao servidor."); }
    invite.disabled = false;
  });

  const cancel = document.getElementById("sponsorCancel");
  if (cancel) cancel.addEventListener("click", async () => {
    try { await after(await fetch("/api/sponsor/cancel", { method: "POST", credentials: "include" })); } catch (e) {}
  });

  const revoke = document.getElementById("sponsorRevoke");
  if (revoke) revoke.addEventListener("click", async () => {
    try { await after(await fetch("/api/sponsor/revoke", { method: "POST", credentials: "include" })); } catch (e) {}
  });

  const leave = document.getElementById("sponsorLeave");
  if (leave) leave.addEventListener("click", async () => {
    try { await after(await fetch("/api/sponsor/leave", { method: "POST", credentials: "include" })); } catch (e) {}
  });

  const accept = document.getElementById("inviteAccept");
  if (accept) accept.addEventListener("click", async () => {
    try {
      await after(await fetch("/api/sponsor/respond", {
        method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accept: true })
      }));
      toast("Convite aceito. Bem-vindo ao Premium.");
    } catch (e) {}
  });
  const decline = document.getElementById("inviteDecline");
  if (decline) decline.addEventListener("click", async () => {
    try {
      await after(await fetch("/api/sponsor/respond", {
        method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accept: false })
      }));
    } catch (e) {}
  });
}

function renderPerfil() {
  const u = state.user;
  const initials = (u.name || "NS").split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
  document.getElementById("screen-perfil").innerHTML = `
    <div class="screen__head">
      <p class="eyebrow">Perfil</p>
      <h1 class="display d-xl" id="tit-perfil">${esc(u.name || "Você")}</h1>
      <div class="rule" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <div class="stack">
      <div class="card">
        <div class="row" style="gap:16px;align-items:center">
          <span class="avatar" aria-hidden="true" style="cursor:default">${esc(initials)}</span>
          <div>
            <p style="margin:0;font-weight:700">${esc(u.email)}</p>
            <p class="muted" style="margin:2px 0 0;font-size:14px">Na NeuroSync desde ${fmtBR(u.since)} · Seu ID: <strong>${esc(u.code || "—")}</strong></p>
          </div>
          <span class="chip ${u.plan === "premium" ? "chip--lime" : "chip--soft"}" style="margin-left:auto">${u.plan === "premium" ? "Premium" : "Básico"}</span>
        </div>
      </div>

      ${sponsorCardsHTML(u)}

      <div class="card">
        <h2 class="display d-m">Preferências</h2>
        <div style="margin-top:16px">
          <div class="field">
            <label for="pfName">Nome</label>
            <input class="input" id="pfName" type="text" value="${esc(u.name)}">
          </div>
          <div class="field">
            <label for="pfProfile">Perfil</label>
            <select id="pfProfile">
              <option value="autismo" ${u.profile === "autismo" ? "selected" : ""}>Autismo</option>
              <option value="tdah" ${u.profile === "tdah" ? "selected" : ""}>TDAH</option>
              <option value="ambos" ${u.profile === "ambos" ? "selected" : ""}>Autismo e TDAH</option>
              <option value="investigando" ${u.profile === "investigando" ? "selected" : ""}>Ainda investigando</option>
            </select>
          </div>
          <div class="row" style="gap:14px">
            <div class="field" style="flex:1;min-width:140px"><label for="pfWake">Acordo às</label><input class="input" id="pfWake" type="time" value="${u.wake}"></div>
            <div class="field" style="flex:1;min-width:140px"><label for="pfSleep">Durmo às</label><input class="input" id="pfSleep" type="time" value="${u.sleep}"></div>
          </div>
          <button class="btn btn--lime" id="pfSave" type="button">Salvar alterações</button>
        </div>
      </div>

      <div class="card card--deep">
        <h2 class="display d-m">Sua conta</h2>
        <p class="muted" style="margin:10px 0 16px;font-size:14.5px">
          Seus dados ficam guardados com segurança no servidor, associados a este e-mail.
        </p>
        <div class="row">
          <button class="btn btn--ghost btn--sm" id="exportData" type="button">Exportar em JSON</button>
          <button class="btn btn--ghost btn--sm" id="logoutBtn" type="button">Sair da conta</button>
          <button class="btn btn--danger btn--sm" id="resetData" type="button">Apagar minha conta</button>
        </div>
      </div>

      <p class="muted" style="text-align:center;font-size:13.5px">
        NeuroSync · <a href="index.html" style="color:var(--lime-400)">voltar ao site</a>
      </p>
    </div>`;

  bindSponsorCards();

  document.getElementById("pfSave").addEventListener("click", async () => {
    state.user.name = document.getElementById("pfName").value.trim() || state.user.name;
    state.user.profile = document.getElementById("pfProfile").value;
    state.user.wake = document.getElementById("pfWake").value;
    state.user.sleep = document.getElementById("pfSleep").value;
    await persist(); paintChrome(); toast("Preferências salvas."); renderPerfil();
  });
  document.getElementById("exportData").addEventListener("click", () => {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "neurosync-dados.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast("Dados exportados.");
    } catch (e) { toast("Não foi possível exportar aqui.", "info"); }
  });
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try { await fetch("/api/logout", { method: "POST", credentials: "include" }); } catch (e) {}
    showAuth();
  });

  const del = document.getElementById("resetData");
  let armed = false;
  del.addEventListener("click", async () => {
    if (!armed) {
      armed = true;
      del.textContent = "Tocar de novo para confirmar";
      setTimeout(() => { armed = false; del.textContent = "Apagar minha conta"; }, 5000);
      return;
    }
    try { await fetch("/api/account", { method: "DELETE", credentials: "include" }); } catch (e) {}
    showAuth();
  });
}

/* ================================================================
   8. ROTEADOR
   ================================================================ */
const RENDER = { hoje: renderHoje, rotina: renderRotina, checkin: renderCheckin, historico: renderHistorico, planos: renderPlanos, perfil: renderPerfil };

function go(name) {
  if (!RENDER[name]) name = "hoje";
  route = name;
  RENDER[name]();
  Object.keys(RENDER).forEach(k => { document.getElementById("screen-" + k).hidden = k !== name; });
  document.querySelectorAll(".tabbar button").forEach(b => {
    b.dataset.go === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
  });
  if (location.hash !== "#/" + name) history.replaceState(null, "", "#/" + name);
  const h1 = document.querySelector("#screen-" + name + " h1");
  if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0, behavior: "auto" });
}

function paintChrome() {
  const u = state.user;
  const chip = document.getElementById("planChip");
  chip.textContent = u.plan === "premium" ? "Premium" : "Básico";
  chip.className = "chip " + (u.plan === "premium" ? "chip--lime" : "chip--soft");
  document.getElementById("avatarBtn").textContent = (u.name || "NS").split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-go]");
  if (btn) { e.preventDefault(); go(btn.dataset.go); }
});
document.getElementById("avatarBtn").addEventListener("click", () => go("perfil"));
window.addEventListener("hashchange", () => {
  const name = location.hash.replace("#/", "");
  if (state && state.onboarded && RENDER[name] && name !== route) go(name);
});

/* ================================================================
   9. BOOT
   ================================================================ */
(async function boot() {
  try {
    const res = await fetch("/api/me", { credentials: "include" });
    if (res.ok) { await afterAuth(await res.json()); return; }
  } catch (e) {}
  showAuth();
})();
</script>
</body>
</html>
